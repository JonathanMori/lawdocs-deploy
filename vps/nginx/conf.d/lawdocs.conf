# Proxy do LawDocs: HTTPS, front, /api e tela do robô e-SAJ (/esaj, com senha).
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name sistema.gruposobrinhoadv.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sistema.gruposobrinhoadv.com.br;

    ssl_certificate     /etc/letsencrypt/live/sistema.gruposobrinhoadv.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sistema.gruposobrinhoadv.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    server_tokens off;
    client_max_body_size 50M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://api:8080;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_read_timeout 300s;
    }

    # Tela do Edge do robô e-SAJ (noVNC) para refazer o login manual.
    location = /esaj {
        return 302 /esaj/vnc.html?autoconnect=1&resize=scale&path=esaj/websockify;
    }

    location /esaj/ {
        auth_basic "LawDocs - robo e-SAJ";
        auth_basic_user_file /etc/nginx/htpasswd;
        proxy_pass http://robos:6080/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://web:80;
    }
}
